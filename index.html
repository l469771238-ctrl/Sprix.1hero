:root{
  --bg:#070b16;
  --green:#2dff7e;
  --blue:#4f9df8;
  --purple:#c792ea;
  --yellow:#f7df1e;
  --glass:rgba(255,255,255,0.05);
  --stroke:rgba(255,255,255,0.12);
  --text:#e8eef7;
  --muted:#9fb3cf;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
*:focus{outline:none;}
button:focus,input:focus,a:focus{outline:none;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Zain',sans-serif;min-height:100vh;overflow-x:hidden;}

#bg3d{position:fixed;inset:0;z-index:0;pointer-events:none;}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 75% 15%,rgba(79,157,248,0.10),transparent 55%),
             radial-gradient(ellipse at 15% 85%,rgba(45,255,126,0.08),transparent 55%);}

.wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:10px 16px 24px;min-height:100vh;display:flex;flex-direction:column;}

/* ── الشاشة الرئيسية: 4 بلوكات متساوية ── */
.home{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:4px;}
.platforms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:center;width:min(860px,100%);margin:0 auto;}
.pbtn{position:relative;cursor:pointer;min-height:340px;padding:30px 20px;transform:translateZ(0);
  background:var(--glass);border:1px solid var(--stroke);border-radius:24px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);font-family:'Zain',sans-serif;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s;}
.pbtn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.09) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s ease;}
.pbtn:hover::after{transform:translateX(120%);}
.pbtn:hover{transform:translateY(-10px) scale(1.02);}
.pbtn .icon{width:84px;height:84px;display:grid;place-items:center;border-radius:22px;
  background:rgba(255,255,255,0.05);border:1px solid var(--stroke);transition:transform .35s;}
.pbtn:hover .icon{transform:scale(1.12) rotate(-4deg);}
.pbtn .icon img,.pbtn .icon svg{width:52px;height:52px;object-fit:contain;}
.js-icon{width:76px !important;height:76px !important;object-fit:contain;
  filter:drop-shadow(0 0 14px rgba(247,223,30,0.45));}
.pbtn .name{font-size:1.6rem;font-weight:900;display:block;}
.pbtn .meta{display:block;font-size:.9rem;color:var(--muted);line-height:1.8;}
.pbtn .go{display:inline-block;margin-top:6px;font-size:.85rem;color:var(--muted);
  padding:6px 18px;border-radius:99px;border:1px solid var(--stroke);transition:all .3s;}
.pbtn:hover .go{color:var(--text);border-color:currentColor;}

.pbtn[data-p="js"]:hover,.pbtn[data-p="js"].active{border-color:var(--yellow);
  box-shadow:0 0 36px rgba(247,223,30,0.30),inset 0 0 22px rgba(247,223,30,0.06);}
.pbtn[data-p="js"] .name{color:var(--yellow);}

/* ── شريط أدوات اللوحة ── */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:16px;
  backdrop-filter:blur(14px);padding:12px 14px;}
.back{background:rgba(255,255,255,0.06);border:1px solid var(--stroke);border-radius:12px;
  padding:9px 16px;color:var(--muted);font-family:'Zain',sans-serif;font-size:.95rem;
  cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:8px;}
.back:hover{color:var(--text);border-color:var(--text);}
.toolbar .back{flex:1;justify-content:center;}
.back svg{width:16px;height:16px;}

/* ── شرائح الوحدات ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:18px;
  scrollbar-width:thin;scrollbar-color:var(--stroke) transparent;}


/* ── شبكة الشباتر/الدروس المربعة ── */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;
  padding:4px 2px 20px;overflow:visible;}
.unit-tile{aspect-ratio:1/1;content-visibility:auto;contain-intrinsic-size:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  cursor:pointer;color:var(--text);font-family:'Kodak Bold','Zain',sans-serif;
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s;overflow:hidden;position:relative;will-change:transform;}
.unit-tile::after{content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.07) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s ease;}
.unit-tile:hover::after{transform:translateX(120%);}
.unit-tile:hover{transform:translateY(-6px) scale(1.04);}
.unit-tile .t-num{font-size:2rem;font-weight:900;line-height:1;}
.unit-tile .t-label{font-size:.75rem;color:var(--muted);font-family:'Zain',sans-serif;}
body[data-active="js"] .unit-tile:hover,body[data-active="js"] .unit-tile.on{border-color:var(--yellow);
  box-shadow:0 0 22px rgba(247,223,30,0.35),inset 0 0 16px rgba(247,223,30,0.08);}
body[data-active="js"] .t-num{color:var(--yellow);}
.unit-tile.back-tile{aspect-ratio:auto;min-height:58px;flex-direction:row;gap:10px;grid-column:1/-1;
  border-radius:14px;font-size:1.05rem;padding:12px;}
.unit-tile.back-tile .t-num{font-size:1.1rem;color:var(--muted);}
.unit-tile.back-tile:hover{border-color:var(--text);box-shadow:0 0 16px rgba(255,255,255,0.15);}
.unit-tile.back-tile span{color:var(--muted);font-family:'Zain',sans-serif;font-weight:700;}
@media(max-width:520px){
  .chips{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;}
  .unit-tile .t-num{font-size:1.5rem;}
}
@media(min-width:1400px){
  .chips{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px;}
  .unit-tile .t-num{font-size:2.4rem;}
}

/* ── الأكورديون ── */
.q{margin-bottom:14px;border-radius:16px;overflow:hidden;background:var(--glass);content-visibility:auto;contain-intrinsic-size:90px;
  border:1px solid var(--stroke);backdrop-filter:blur(14px);transition:border-color .3s;}
body[data-active="js"] .q:hover,body[data-active="js"] .q.open{border-color:rgba(247,223,30,0.45);}
.q-head{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none;}
.q-head:hover{background:rgba(255,255,255,0.04);}
.q-num{flex-shrink:0;min-width:34px;height:34px;padding:0 6px;border-radius:10px;
  display:grid;place-items:center;font-weight:900;background:rgba(255,255,255,0.06);
  border:1px solid var(--stroke);font-size:.95rem;}
body[data-active="js"] .q-num{color:var(--yellow);}
.q-title{flex:1;font-size:1.02rem;font-weight:700;line-height:1.7;}
.q-arrow{color:var(--muted);transition:transform .35s;flex-shrink:0;}
.q.open .q-arrow{transform:rotate(180deg);}
.q-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.22,1,.36,1);}
.q.open .q-body{max-height:4000px;}
.q-inner{padding:2px 18px 20px;}
.q-question{color:var(--muted);font-size:.92rem;margin-bottom:10px;line-height:1.8;direction:ltr;text-align:left;}
.q-question b{color:var(--text);}
.crumb{font-size:.78rem;color:var(--muted);display:block;margin-bottom:4px;}

.answer{position:relative;direction:ltr;text-align:left;background:rgba(0,0,0,0.45);
  border:1px solid var(--stroke);border-radius:12px;padding:16px 14px;overflow-x:auto;}
.answer.text{direction:ltr;text-align:left;font-size:1rem;line-height:1.8;color:#cfdcee;
  font-family:'Zain',sans-serif;white-space:pre-wrap;}
.answer pre{font-family:'Fira Code',monospace;font-size:.86rem;line-height:1.7;color:#d6e4ff;margin:0;}
.answer:has(.copy-btn){padding-top:46px;}
.answer.text:has(.copy-btn){padding-top:46px;}
.copy-btn{position:absolute;top:6px;right:6px;min-height:44px;min-width:64px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);
  border:1px solid var(--stroke);color:var(--muted);border-radius:8px;
  padding:4px 12px;font-family:'Zain',sans-serif;font-size:.78rem;cursor:pointer;transition:all .25s;}
.copy-btn:hover{color:var(--text);border-color:var(--text);}
.answer.text .copy-btn{direction:ltr;}

.group-title{display:flex;align-items:center;gap:10px;margin:26px 0 14px;
  font-size:1.15rem;font-weight:800;padding-right:12px;border-right:4px solid var(--green);}
.group-title.level-head{font-size:1.35rem;border-right-color:var(--yellow);margin-top:8px;}
.group-title.section-head{font-size:1.02rem;color:var(--muted);border-right-color:var(--stroke);margin:20px 0 10px;}


/* ── بلوك المنصة الرئيسية ── */
.pbtn[data-p="portal"]:hover{border-color:#ff2e88;
  box-shadow:0 0 36px rgba(255,46,136,0.35),inset 0 0 22px rgba(255,46,136,0.06);}
.pbtn[data-p="portal"] .name{color:#ff5ea8;}
.portal-flower img{position:relative;z-index:1;width:110px;height:auto;filter:drop-shadow(0 0 12px rgba(255,46,136,0.30));
  animation:flowerSpin 14s linear infinite;}
@keyframes flowerSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.portal-logo{background:rgba(255,255,255,0.92);border-radius:12px;padding:8px 14px;
  display:inline-flex;align-items:center;justify-content:center;max-width:88%;}
.portal-logo img{width:100%;max-width:210px;height:auto;display:block;}
@media(max-width:520px){
  .portal-flower img{width:72px;}
  .portal-logo img{max-width:140px;}
  .portal-logo{padding:6px 10px;}
}


/* ── العنوان الرئيسي: Game Over + نيون أخضر ── */
.main-title{font-family:'Game Over','Zain',monospace;text-align:center;
  font-size:26vw;line-height:1;letter-spacing:0;white-space:nowrap;
  font-weight:400;font-synthesis:none;
  margin:-.26em auto calc(-.22em + clamp(12px,2.2vw,34px));padding:0 6px;width:100%;
  background:linear-gradient(180deg,#e6fff2 0%,#8dffb9 32%,#2dff7e 62%,#00d95f 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 10px rgba(45,255,126,0.55)) drop-shadow(0 0 34px rgba(45,255,126,0.35)) drop-shadow(0 0 70px rgba(45,255,126,0.22));
  animation:titleGlow 3.2s ease-in-out infinite alternate;}
@keyframes titleGlow{
  from{filter:drop-shadow(0 0 8px rgba(45,255,126,0.45)) drop-shadow(0 0 26px rgba(45,255,126,0.28)) drop-shadow(0 0 56px rgba(45,255,126,0.16));}
  to{filter:drop-shadow(0 0 16px rgba(45,255,126,0.8)) drop-shadow(0 0 46px rgba(45,255,126,0.5)) drop-shadow(0 0 92px rgba(45,255,126,0.32));}}



/* ── بلوك التنويه الأحمر (أسفل الصفحة) ── */
.disclaimer-box{max-width:640px;margin:10px auto 0;background:rgba(220,38,38,0.10);
  border:1px solid rgba(255,80,80,0.4);border-radius:12px;
  padding:9px 18px;color:#ffc4c4;font-family:'Zain',sans-serif;
  font-size:.82rem;line-height:1.9;text-align:center;
  box-shadow:0 0 18px rgba(220,38,38,0.15);}


/* ── زرار عن المنصة العائم ── */

/* ── مودال من نحن ── */
.about-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,13,0.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .35s ease;padding:18px;}
.about-overlay.open{opacity:1;pointer-events:auto;}
.about-modal{position:relative;width:min(520px,94vw);text-align:center;will-change:transform;
  background:linear-gradient(160deg,rgba(255,255,255,0.09),rgba(255,255,255,0.03));
  border:1px solid rgba(255,255,255,0.16);border-radius:26px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:46px 36px 40px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,0.55),0 0 44px rgba(45,255,126,0.1),inset 0 1px 0 rgba(255,255,255,0.12);
  transform:scale(0.86) translateY(22px);transition:transform .42s cubic-bezier(.22,1,.36,1);}
.about-overlay.open .about-modal{transform:scale(1) translateY(0);}
.about-modal::before{content:'';position:absolute;top:-70px;left:50%;transform:translateX(-50%);
  width:260px;height:150px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(45,255,126,0.22),transparent 70%);
  filter:blur(12px);pointer-events:none;}
.about-title{font-family:'Khaybar 3D','Amiri',serif;font-size:clamp(2rem,6vw,2.9rem);font-weight:700;
  margin-bottom:24px;line-height:1.4;
  background:linear-gradient(90deg,#2dff7e,#4f9df8 60%,#c792ea);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(79,157,248,0.4));}
.about-body b{color:#2dff7e;font-weight:800;}

/* ── تخطيط من نحن الجديد ── */
.about-lead{text-align:center;color:#9fb3cf;font-family:'Zain',sans-serif;
  font-size:1.1rem;margin-bottom:18px;letter-spacing:.03em;}
.about-person{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;padding:26px 22px 24px;margin:0 2px;
  box-shadow:0 0 26px rgba(79,157,248,0.10),inset 0 1px 0 rgba(255,255,255,0.07);}
.about-person .p-name{font-family:'Khebrat','Khaybar 3D','Zain',serif;
  font-size:clamp(2.1rem,7vw,2.9rem);font-weight:700;line-height:1.35;
  color:#4f9df8;filter:drop-shadow(0 0 16px rgba(79,157,248,0.45));}

.about-person .p-role{color:#c6d4e8;font-family:'Zain',sans-serif;font-size:1.02rem;
  line-height:1.85;text-align:center;max-width:34ch;}





.about-close{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);color:#9fb3cf;cursor:pointer;transition:all .25s;}
.about-close svg{width:17px;height:17px;}
.about-close:hover{color:#fff;border-color:#fff;transform:rotate(90deg);}


/* ═══ شاشات كبيرة: لابتوب وكمبيوتر (1400px+) ═══ */


#panel{position:relative;z-index:5;}

/* ── زرار السهم + القسم المخفي ── */
.expand-btn{display:flex;align-items:center;justify-content:center;width:56px;height:56px;
  margin:16px auto 0;border-radius:50%;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#9fb3cf;transition:all .35s cubic-bezier(.22,1,.36,1);}
.expand-btn svg{width:24px;height:24px;transition:transform .45s cubic-bezier(.22,1,.36,1);}
.expand-btn:hover{border-color:#4f9df8;color:#4f9df8;box-shadow:0 0 20px rgba(79,157,248,0.3);transform:translateY(-3px);}
.expand-btn.open svg{transform:rotate(180deg);}
.home-extra{max-height:0;overflow:hidden;transition:max-height .65s cubic-bezier(.22,1,.36,1);}
.home-extra.open{max-height:700px;}

/* ── بلوك عن المنصة المربع ── */
.about-block{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  min-height:96px;margin-top:12px;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);border-radius:22px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#e8eef7;font-family:'Kodak Bold','Zain',sans-serif;font-size:1.35rem;font-weight:900;
  overflow:hidden;position:relative;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s;}
.about-block::after{content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.09) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s ease;}
.about-block:hover::after{transform:translateX(120%);}
.about-block:hover{transform:translateY(-6px);border-color:#4f9df8;
  box-shadow:0 0 30px rgba(79,157,248,0.35),inset 0 0 18px rgba(79,157,248,0.07);}
.about-block svg{width:30px;height:30px;color:#4f9df8;}
.about-block span{color:#4f9df8;}
@media(min-width:1400px){
  .about-block{min-height:120px;font-size:1.6rem;gap:16px;border-radius:26px;margin-top:16px;}
  .about-block svg{width:38px;height:38px;}
}
@media(max-width:520px){
  .about-block{min-height:72px;font-size:1.1rem;gap:10px;}
  .about-block svg{width:24px;height:24px;}
}

@media(min-width:1400px){
  .wrap{max-width:1460px;padding:26px 40px 40px;}
        .platforms{gap:24px;}
  .pbtn{min-height:460px;padding:44px 28px;gap:20px;border-radius:30px;}
  .pbtn .icon{width:116px;height:116px;border-radius:30px;}
  .pbtn .icon img,.pbtn .icon svg{width:72px;height:72px;}
  .js-icon{width:104px !important;height:104px !important;}
  .pbtn .name{font-size:2.1rem;}
  .pbtn .meta{font-size:1.05rem;line-height:1.9;}
  .pbtn .go{font-size:1rem;padding:9px 26px;margin-top:10px;}
  .portal-flower img{width:150px;}
  .portal-logo img{max-width:280px;}
  .disclaimer-box{max-width:860px;font-size:1.05rem;padding:16px 30px;margin-top:24px;}
      .toolbar{padding:16px 20px;border-radius:20px;}
    .back{font-size:1.1rem;padding:11px 22px;}
  .chips{gap:12px;padding-bottom:16px;}
    .q-head{padding:20px 24px;}
  .q-title{font-size:1.2rem;}
  .q-num{min-width:40px;height:40px;font-size:1.1rem;}
  .answer pre{font-size:1rem;}
  .answer.rtl{font-size:1.15rem;}
  .group-title{font-size:1.4rem;}
}

/* ═══ تابلت أفقي وشاشات وسط (1025px - 1399px) ═══ */
@media(min-width:1025px) and (max-width:1399px){
  .wrap{max-width:1100px;}
    .pbtn{min-height:380px;padding:34px 22px;}
  .pbtn .icon{width:92px;height:92px;}
  .pbtn .icon img,.pbtn .icon svg{width:56px;height:56px;}
  .pbtn .name{font-size:1.7rem;}
  .disclaimer-box{max-width:700px;font-size:.95rem;}
}

@media(max-width:1024px){
  .platforms{grid-template-columns:repeat(2,1fr);}
  .pbtn{min-height:250px;}
}
@media(max-width:520px){
  .platforms{grid-template-columns:repeat(2,1fr);gap:12px;}
  .pbtn{min-height:210px;padding:20px 12px;border-radius:18px;}
  .pbtn .icon{width:60px;height:60px;border-radius:16px;}
  .pbtn .icon img,.pbtn .icon svg{width:38px;height:38px;}
  .js-icon{width:52px !important;height:52px !important;}
  .pbtn .name{font-size:1.2rem;}
  .pbtn .meta{font-size:.8rem;}
  .pbtn .go{font-size:.75rem;padding:4px 12px;}
}

/* ── اختيار المسار: عربي / لغات ── */
.track-wrap{display:flex;align-items:center;justify-content:center;width:min(940px,100%);margin:26px auto 10px;}
.track-btn{position:relative;flex:0 0 auto;min-width:210px;min-height:170px;padding:26px 22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:24px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);font-family:'Zain',sans-serif;cursor:pointer;overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s;}
.track-btn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.08) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s ease;}
.track-btn:hover::after{transform:translateX(120%);}
.track-btn:hover{transform:translateY(-6px);}
.track-name{font-family:'Kodak Bold','Zain',sans-serif;font-size:1.9rem;font-weight:900;line-height:1.2;}
.track-meta{font-size:.9rem;color:var(--muted);}
.track-btn[data-track="ar"] .track-name{color:var(--blue);}
.track-btn[data-track="ar"]:hover{border-color:rgba(79,157,248,0.7);
  box-shadow:0 0 24px rgba(79,157,248,0.20),inset 0 0 16px rgba(79,157,248,0.05);}
.track-btn[data-track="lang"] .track-name{color:var(--green);}
.track-btn[data-track="lang"]:hover{border-color:rgba(45,255,126,0.7);
  box-shadow:0 0 24px rgba(45,255,126,0.20),inset 0 0 16px rgba(45,255,126,0.05);}
.track-link{flex:1 1 auto;display:flex;align-items:center;gap:12px;padding:0 16px;min-width:0;}
.track-line{flex:1 1 auto;height:2px;min-width:14px;
  background:linear-gradient(90deg,transparent,rgba(199,146,234,0.85),transparent);
  box-shadow:0 0 8px rgba(199,146,234,0.40);}
.track-pill{flex:0 0 auto;white-space:nowrap;color:#c792ea;background:rgba(199,146,234,0.10);
  border:1px solid rgba(199,146,234,0.45);border-radius:99px;padding:7px 20px;
  font-family:'Khaybar 3D','Zain',serif;font-size:1rem;
  box-shadow:0 0 14px rgba(199,146,234,0.18),inset 0 0 10px rgba(199,146,234,0.06);}
.track-empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:2;font-size:1.05rem;}
@media(max-width:640px){
  .track-wrap{flex-direction:column;margin:18px auto 8px;}
  .track-btn{width:100%;min-width:0;min-height:118px;padding:20px;}
  .track-name{font-size:1.6rem;}
  .track-link{flex-direction:column;width:100%;padding:10px 0;gap:8px;}
  .track-line{width:2px;height:22px;min-width:0;flex:0 0 auto;
    background:linear-gradient(180deg,transparent,rgba(199,146,234,0.85));}
  .track-link .track-line:last-child{background:linear-gradient(180deg,rgba(199,146,234,0.85),transparent);}
}

/* ── هالة RGB بتتغيّر بسلاسة خلف وردة SPRIX ── */
.portal-flower{position:relative;display:inline-grid;place-items:center;isolation:isolate;}
.portal-flower::before{content:'';position:absolute;z-index:-1;pointer-events:none;
  width:200%;aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,46,136,0.55) 0%,rgba(255,46,136,0.26) 38%,rgba(255,46,136,0) 68%);
  filter:blur(16px);animation:rgbHalo 9s linear infinite;}
@keyframes rgbHalo{
  0%{filter:blur(16px) hue-rotate(0deg);opacity:.8;}
  50%{filter:blur(20px) hue-rotate(180deg);opacity:1;}
  100%{filter:blur(16px) hue-rotate(360deg);opacity:.8;}}
@media(prefers-reduced-motion:reduce){
  .portal-flower::before,.portal-flower img,.main-title{animation:none;}
}

 {console.log(\"miss\")}", "t": false, "copy": true}, {"n": 6, "q": "Choose the output of the program when score = 92.", "a": "So close", "t": true, "copy": true}, {"n": 7, "q": "num <= 3 → \"A\", num >= 6 → \"B\", otherwise \"C\". Missing parts in order: num <= 3, then num >= 6, then else", "a": "let num = 4;\nif (num <= 3){console.log(\"A\");}\nelse if (num >= 6){console.log(\"B\");}\nelse {console.log(\"C\");}", "t": false, "copy": true}]}]}, "9": {"title": "Compound Conditions && and ||", "sections": [{"title": "Lesson 1: The && Condition (AND)", "items": [{"n": 1, "q": "Print \"20% off\" if numberOfPeople >= 2 and fee >= 3000. Missing part:", "a": "let numberOfPeople = 3;\nlet fee = 3500;\nif (numberOfPeople >= 2 && fee >= 3000){console.log(\"20% off\");}", "t": false, "copy": true}, {"n": 2, "q": "Same question (repeated). Missing part:", "a": "let numberOfPeople = 3;\nlet fee = 3500;\nif (numberOfPeople >= 2 && fee >= 3000){console.log(\"20% off\");}", "t": false, "copy": true}]}, {"title": "Lesson 2: && and ||", "items": [{"n": 1, "q": "What is the \"&\" symbol called?", "a": "ampersand", "t": true, "copy": true}, {"n": 2, "q": "What is the \"|\" symbol called?", "a": "Vertical bar", "t": true, "copy": true}, {"n": 3, "q": "numberOfPeople = 2 and fee = 3500: if >= 2 and >= 3000 print \"Free mug\".", "a": "let numberOfPeople = 2;\nlet fee = 3500;\nif (numberOfPeople >= 2 && fee >= 3000){console.log(\"Free mug\");}", "t": false, "copy": true}, {"n": 4, "q": "age = 15: if age <= 12 or age >= 65 print \"30% off\".", "a": "let age = 15;\nif (age <= 12 || age >= 65){console.log(\"30% off\");}", "t": false, "copy": true}]}, {"title": "Level 9 Review", "items": [{"n": 1, "q": "Choose the program that means \"A and B\".", "a": "A && B", "t": false, "copy": true}, {"n": 2, "q": "Choose the program that means \"A or B\".", "a": "A || B", "t": false, "copy": true}, {"n": 3, "q": "Choose the output when age = 20 (condition age <= 18 || age >= 60).", "a": "Regular Price", n": 1, "q": "Choose the correct program to output a random value.", "a": "console.log(Math.random());", "t": false, "copy": true}, {"n": 2, "q": "Choose the correct function for cutting off decimals.", "a": "console.log(Math.floor(10.5));", "t": false, "copy": true}, {"n": 3, "q": "Output of console.log(Math.floor(7.7));", "a": "7", "t": true, "copy": true}, {"n": 4, "q": "Round 5.5 with Math.round, and round 8.8 down with Math.floor.", "a": "console.log(Math.round(5.5))\nconsole.log(Math.floor(8.8))", "t": false, "copy": true}, {"n": 5, "q": "Type the condition: the random value is greater than or equal to 0.5. Full code:", "a": "if (Math.random() >= 0.5) {\n  console.log(\"Excellent luck\");\n} else {\n  console.log(\"Bad luck\");\n}", "t": false, "copy": true}, {"n": 6, "q": "A random whole number from 0 to 9 on one line.", "a": "console.log(Math.floor(Math.random() * 10));", "t": false, "copy": true}]}]}, "14": {"title": "Review of Levels 12 and 13", "sections": [{"title": "Review of Levels 12–13", "items": [{"n": 1, "q": "Round 5.7 with Math.round and print.", "a": "console.log(Math.round(5.7));", "t": false, "copy": true}, {"n": 2, "q": "Pass 5.5 to Math.round and then Math.floor and print each.", "a": "console.log(Math.round(5.5));\nconsole.log(Math.floor(5.5));", "t": false, "copy": true}, {"n": 3, "q": "Pass 10 and 20 to Math.max and then Math.min and print each.", "a": "console.log(Math.max(10,20));\nconsole.log(Math.min(10,20));", "t": false, "copy": true}, {"n": 4, "q": "Call Math.random and print.", "a": "console.log(Math.random());", "t": false, "copy": true}, {"n": 5, "q": "Create the function split4 (total / 4) and pass 1200.", "a": "function split4(total) {\n  let result = total / 4;\n  return result;\n}\nconsole.log(split4(1200));", "t": false, "copy": true}]}, {"title": "Level 14 Test", "items": [{"n": 1, "q": "Choose the correct function for rounding.", "a": "Math.round(1.8)", "t": false, "copy": true}, {"n": 2, "q": "Output of console.log(Math.max(10,50,100));", "a": "100", "t": true, "copy": true}, {"n": 3, "q": "Choose the correct program to output a random value.", "a": "console.log(Math.random());", "t": false, "copy": true}, {"n": 4, "q": "Output of console.log(Math.floor(12.8));", "a": "12", "t": true, "copy": true}, {"n": 5, "q": "A random whole number (Math.random × 10 then floor) on one line.", "a": "console.log(Math.floor(Math.random() * 10));", "t": false, "copy": true}, {"n": 6, "q": "Choose the correct program to create a function named sum with the parameter num.", "a": "function sum(num) {\n  processing\n}", "t": false, "copy": true}, {"n": 7, "q": "Return the value of result (third line).", "a": "return result", "t": false, "copy": true}, {"n": 8, "q": "Call the function calc with the value 7 (fifth line).", "a": "calc(7)", "t": false, "copy": true}]}]}, "15": {"title": "Data Types and Comparison", "sections": [{"title": "Lesson 1: Variables and Text", "items": [{"n": 1, "q": "Declare fee and assign 1000 (first line). Full code:", "a": "let fee = 1000;\nif (fee == 1000) {\n  console.log(\"50 codycoins off\");\n}", "t": false, "copy": true}, {"n": 2, "q": "Declare fee and assign the text \"1000 codycoins\" (first line). Full code:", "a": "let fee = \"1000 codycoins\";\nif (fee == \"1000 codycoins\") {\n  console.log(\"50 codycoins off\");\n}", "t": false, "copy": true}]}, {"title": "Lesson 2: Data Types", "items": [{"n": 1, "q": "What is the type of console.log(\"Good morning.\");?", "a": "String", "t": true, "copy": true}, {"n": 2, "q": "What is the type of console.log(10);?", "a": "Number", "t": true, "copy": true}, {"n": 3, "q": "What is the type of console.log(\"5+7\");?", "a": "String", "t": true, "copy": true}]}, {"title": "Lesson 3: typeof", "items": [{"n": 1, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 3, "q": "Enter the same program.", "a": "console.log(typeof 500);\nconsole.log(typeof \"500 codycoins\");", "t": false, "copy": true}, {"n": 4, "q": "Find the data type of \"100\" and print it.", "a": "console.log(typeof \"100\");", "t": false, "copy": true}]}, {"title": "Lesson 4: Comparison with === and ==", "items": [{"n": 1, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 3, "q": "Enter the same program.", "a": "console.log(1 === 1);", "t": false, "copy": true}, {"n": 4, "q": "What is the result of console.log(100 == \"100\");?", "a": "true", "t": true, "copy": true}, {"n": 5, "q": "What is the result of console.log(100 === 500);?", "a": "false", "t": true, "copy": true}, {"n": 6, "q": "What is the result of console.log(\"Good morning\" === \"Good morning\");?", "a": "true", "t": true, "copy": true}, {"n": 7, "q": "What is the result of console.log(\"Good morning\" === \"Good night\");?", "a": "false", "t": true, "copy": true}]}, {"title": "Lesson 5: Converting Between Types", "items": [{"n": 1, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Create the program as follows.", "a": "console.log(Number(\"10\"));\nconsole.log(String(500));", "t": false, "copy": true}]}, {"title": "Level 15 Review", "items": [{"n": 1, "q": "Choose the correct data type for console.log(\"50+30\");", "a": "String", "t": true, "copy": true}, {"n": 2, "q": "Choose the program that outputs string.", "a": "console.log(typeof \"1\");", "t": false, "copy": true}, {"n": 3, "q": "Output of console.log(100 === 500);", "a": "false", "t": true, "copy": true}, {"n": 4, "q": "Output of console.log(Number(\"Hello\"));", "a": "NaN", "t": true, "copy": true}, {"n": 5, "q": "Find the data type of \"7\" and print it.", "a": "console.log(typeof \"7\")", "t": false, "copy": true}]}]}, "16": {"title": "Arrays", "sections": [{"title": "Lesson 1: Running the Program", "items": [{"n": 1, "q": "Press “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Press “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}]}, {"title": "Lesson 2: Creating an Array and Accessing Elements", "items": [{"n": 1, "q": "Create the array.", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];", "t": false, "copy": true}, {"n": 2, "q": "Print the element at index 2 (second line).", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];\nconsole.log(tempList[2]);", "t": false, "copy": true}, {"n": 3, "q": "Print the value 33 from tempList.", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];\nconsole.log(tempList[5]);", "t": false, "copy": true}, {"n": 4, "q": "Print the whole array tempList.", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];\nconsole.log(tempList);", "t": false, "copy": true}]}, {"title": "Lesson 3: Sum and Average of an Array", "items": [{"n": 1, "q": "Create the array.", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];", "t": false, "copy": true}, {"n": 2, "q": "Calculate the sum with a for loop (from the second line).", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];\nlet total = 0;\nfor(let i = 0; i < 7; i++){\n  total = total + tempList[i];\n}\nconsole.log(total);", "t": false, "copy": true}, {"n": 3, "q": "Print the average (last line: total / 7).", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36];\nlet total = 0;\nfor(let i = 0; i < 7; i++){\n  total = total + tempList[i];\n}\nconsole.log(total / 7);", "t": false, "copy": true}]}, {"title": "Lesson 4: Average Applications", "items": [{"n": 1, "q": "The distances 5, 2, 4, 1, 3 and 3 in the array runLogs.", "a": "let runLogs = [5, 2, 4, 1, 3, 3];", "t": false, "copy": true}, {"n": 2, "q": "Calculate the total distance (lines 2 to 5). Full code:", "a": "let runLogs = [5, 2, 4, 1, 3, 3];\nlet total = 0;\nfor (let i = 0; i < 6; i++) {\n  total = total + runLogs[i];\n}\nconsole.log(total);", "t": false, "copy": true}, {"n": 3, "q": "Print the average distance (sixth line). Full code:", "a": "let runLogs = [5, 2, 4, 1, 3, 3];\nlet total = 0;\nfor (let i = 0; i < 6; i++) {\n  total = total + runLogs[i];\n}\nconsole.log(total / 6);", "t": false, "copy": true}, {"n": 4, "q": "Average steps over 6 days. Full code:", "a": "let steps = [16000, 12000, 14605, 9920, 13805, 14500];\nlet total = 0;\nfor (let i = 0; i < 6; i++) {\n  total = total + steps[i];\n}\nconsole.log(total / 6);", "t": false, "copy": true}]}, {"title": "Lesson 5: length and Adding Values", "items": [{"n": 1, "q": "Add the values 30, 28 and 29 to the array (the blank):", "a": "30, 28, 29", "t": false, "copy": true}, {"n": 2, "q": "Print the length of the array (second line). Full code:", "a": "let tempList = [36, 36, 26, 27, 28, 33, 36, 30, 28, 29];\nconsole.log(tempList.length);", "t": false, "copy": true}, {"n": 3, "q": "Print the length of the array (second line).", "a": "console.log(tempList.length);", "t": false, "copy": true}]}, {"title": "Level 16 Review", "items": [{"n": 1, "q": "Put the values 5, 10 and 15 in the array (no output).", "a": "let num = [5, 10, 15];", "t": false, "copy": true}, {"n": 2, "q": "Output of console.log(num[2]); where num = [5, 10, 15, 20, 25]", "a": "15", "t": true, "copy": true}, {"n": 3, "q": "Print all the values in the array (the blank):", "a": "num", "t": false, "copy": true}, {"n": 4, "q": "Output of the sum of [1, 2, 3] using a for loop.", "a": "6", "t": true, "copy": true}, {"n": 5, "q": "Print the length of the array (the blank):", "a": "num.length", "t": false, "copy": true}]}]}, "17": {"title": "Review of Levels 15 and 16", "sections": [{"title": "Review of Levels 15–16", "items": [{"n": 1, "q": "Enter the same program.", "a": "console.log(typeof 500);\nconsole.log(typeof \"500codycoins\");", "t": false, "copy": true}, {"n": 2, "q": "Enter the same program.", "a": "console.log(1 === \"1\");", "t": false, "copy": true}, {"n": 3, "q": "Enter the same program.", "a": "console.log(Number(\"5\"));\nconsole.log(String(10));", "t": false, "copy": true}, {"n": 4, "q": "Temperatures 10, 15, 13, 16, 14, 12 and 17: enter the same program.", "a": "let tempList = [10, 15, 13, 16, 14, 12, 17];\nconsole.log(tempList[2]);", "t": false, "copy": true}, {"n": 5, "q": "Temperatures 5, 8, 7, 10, 6 and 9: assign them to tempList.", "a": "let tempList = [5, 8, 7, 10, 6, 9];", "t": false, "copy": true}, {"n": 6, "q": "Print the average temperature over 6 days. Full code:", "a": "let tempList = [5, 8, 7, 10, 6, 9];\nlet total = 0;\nfor (let i = 0; i < 6; i++) {\n  total = total + tempList[i];\n}\nconsole.log(total / 6);", "t": false, "copy": true}, {"n": 7, "q": "Print the number of values in the array (the blank):", "a": "tempList.length", "t": false, "copy": true}]}, {"title": "Level 17 Test", "items": [{"n": 1, "q": "Choose the correct data type for console.log(\"11\");", "a": "String", "t": true, "copy": true}, {"n": 2, "q": "Choose the program that outputs \"string\".", "a": "console.log(typeof \"50\");", "t": false, "copy": true}, {"n": 3, "q": "Output of console.log(200 === 20);", "a": "false", "t": true, "copy": true}, {"n": 4, "q": "Output of console.log(Number(\"value\"));", "a": "NaN", "t": true, "copy": true}, {"n": 5, "q": "Find the data type of 100 and print it.", "a": "console.log(typeof 100)", "t": false, "copy": true}, {"n": 6, "q": "Put the values 10, 50, 100 and 150 between the brackets:", "a": "10, 50, 100, 150", "t": false, "copy": true}, {"n": 7, "q": "Output of console.log(num[3]); where num = [5, 10, 15, 20, 25]", "a": "20", "t": true, "copy": true}, {"n": 8, "q": "Print all the values in the array (the blank between the parentheses):", "a": "num", "t": false, "copy": true}, {"n": 9, "q": "Output of the sum of [2, 4, 6] using a for loop.", "a": "12", "t": true, "copy": true}, {"n": 10, "q": "Print the length of the array (the blank):", "a": "num.length", "t": false, "copy": true}]}]}, "18": {"title": "Introduction to HTML", "sections": [{"title": "Lesson 1: Introduction", "items": [{"n": 1, "q": "This lesson has no questions.", "a": "There are no questions in this lesson.", "t": true, "copy": true}]}, {"title": "Lesson 2: Headings and Paragraphs", "items": [{"n": 1, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Display the text the same way (h1 tag):", "a": "<h1>Cody's Notepad</h1>", "t": false, "copy": true}, {"n": 3, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 4, "q": "Display the two texts with h3 and h6 tags:", "a": "<h3>Cody's Notepad</h3>\n<h6>Today's shopping list</h6>", "t": false, "copy": true}, {"n": 5, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 6, "q": "On the third line write the paragraph tag (leave the first two lines):", "a": "<h1>Cody's Notepad</h1>\n<h2>Today's shopping list</h2>\n<p>Bread</p>", "t": false, "copy": true}, {"n": 7, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 8, "q": "Display the text on new lines (br tag). Full code:", "a": "<h1>Cody's Notepad</h1>\n<h2>Today's shopping list</h2>\n<p>Bread<br>\nHam<br>\nCheese</p>", "t": false, "copy": true}]}, {"title": "Lesson 3: Lists", "items": [{"n": 1, "q": "Create the shopping list with the tags h1, h2, p and br.", "a": "<h1>Rick's Notebook</h1>\n<h2>Shopping List</h2>\n<p>Tomato<br>\nOnion<br>\nMushroom<br>\nGarlic</p>", "t": false, "copy": true}, {"n": 2, "q": "Create a bulleted list.", "a": "<h1>Shopping List</h1>\n<ul>\n<li>Tomato</li>\n<li>Onion</li>\n<li>Mushroom</li>\n<li>Garlic</li>\n</ul>", "t": false, "copy": true}, {"n": 3, "q": "Turn the words into a bulleted list with the ul and li tags.", "a": "<h1>Shopping List</h1>\n<ul>\n<li>Tomato</li>\n<li>Onion</li>\n<li>Mushroom</li>\n<li>Garlic</li>\n</ul>", "t": false, "copy": true}, {"n": 4, "q": "Create the class schedule (numbered list).", "a": "<h1>Tomorrow's Schedule</h1>\n<ol>\n<li>Science</li>\n<li>Math</li>\n<li>Music</li>\n<li>History</li>\n<li>Physical Education</li>\n</ol>", "t": false, "copy": true}, {"n": 5, "q": "A numbered list of Science, Math, Music, History and Physical Education.", "a": "<h1>Tomorrow's Schedule</h1>\n<ol>\n<li>Science</li>\n<li>Math</li>\n<li>Music</li>\n<li>History</li>\n<li>Physical Education</li>\n</ol>", "t": false, "copy": true}]}, {"title": "Lesson 4: Images", "items": [{"n": 1, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 3, "q": "Display the curry rice image (img tag on the third line):", "a": "<h1>Cooking Wishlist</h1>\n<ul>\n<li>Curry rice<img></li>\n<li>Japanese rice omelette</li>\n</ul>", "t": false, "copy": true}, {"n": 4, "q": "Add the src attribute:", "a": "<h1>Cooking Wishlist</h1>\n<ul>\n<li>Curry rice<img src=\"curry.png\"></li>\n<li>Japanese rice omelette</li>\n</ul>", "t": false, "copy": true}, {"n": 5, "q": "Move the image to a new line with the br tag:", "a": "<h1>Cooking Wishlist</h1>\n<ul>\n<li>Curry rice<br><img src=\"curry.png\"></li>\n<li>Japanese rice omelette</li>\n</ul>", "t": false, "copy": true}, {"n": 6, "q": "Display the Japanese rice omelette image (omelette.png):", "a": "<h1>Cooking Wishlist</h1>\n<ul>\n<li>Curry rice<br><img src=\"curry.png\"></li>\n<li>Japanese rice omelette<br><img src=\"omelette.png\"></li>\n</ul>", "t": false, "copy": true}, {"n": 7, "q": "Display the pasta image (pasta.png):", "a": "<h1>Cooking Wishlist</h1>\n<ul>\n<li>Curry rice<br><img src=\"curry.png\"></li>\n<li>Japanese rice omelette<br><img src=\"omelette.png\"></li>\n<li>Pasta<br><img src=\"pasta.png\"></li>\n</ul>", "t": false, "copy": true}, {"n": 8, "q": "Click “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 9, "q": "Add a description to the images (lines 3 and 4):", "a": "alt=\"Rice with spicy sauce\"\nalt=\"Japanese rice omelette with ketchup\"", "t": false, "copy": true}]}, {"title": "Lesson 5: Drink Menu and Comments", "items": [{"n": 1, "q": "Display the drink menu with the h1, p and br tags.", "a": "<h1>Drink Menu</h1>\n<p>Orange juice: 200 codycoins<br>\nApple juice: 150 codycoins</p>", "t": false, "copy": true}, {"n": 2, "q": "Make the first line a comment.", "a": "<!-- Prices will be revised next week. -->\n<h1>Drink Menu</h1>\n<p>Orange juice: 200 codycoins<br>\nApple juice: 150 codycoins</p>", "t": false, "copy": true}, {"n": 3, "q": "How was your first experience with HTML?", "a": "It was fun!", "t": true, "copy": true}]}, {"title": "Level 18 Review", "items": [{"n": 1, "q": "Wrap the text in an h1 tag.", "a": "<h1>Hello</h1>", "t": false, "copy": true}, {"n": 2, "q": "Choose the correct way to write a p tag.", "a": "<p>Hello</p>", "t": false, "copy": true}, {"n": 3, "q": "Choose the right tag for a line break.", "a": "br tag", "t": true, "copy": true}, {"n": 4, "q": "Choose the tag for creating a bulleted list.", "a": "ul tag", "t": true, "copy": true}, {"n": 5, "q": "Choose what will be displayed for the numbered list.", "a": "1. Cut ingredients 2. Stir-fry 3. Add seasonings", "t": true, "copy": true}, {"n": 6, "q": "Choose the tag to display an image named image.png.", "a": "<img src=\"image.png\">", "t": false, "copy": true}, {"n": 7, "q": "Choose the correct way to write the alt attribute.", "a": "<img alt=\"This is an image.\">", "t": false, "copy": true}, {"n": 8, "q": "Write a comment on the first line.", "a": "<!--The h1 tag is a heading.-->\n<h1>Hello</h1>", "t": false, "copy": true}]}]}, "19": {"title": "Introduction to CSS", "sections": [{"title": "Lesson 1: Colors", "items": [{"n": 1, "q": "Press “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Press “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 3, "q": "Change the h1 text color to red.", "a": "h1{\n  color: red;\n}", "t": false, "copy": true}, {"n": 4, "q": "Change the h1 text color to blue.", "a": "h1{\n  color: blue;\n}", "t": false, "copy": true}, {"n": 5, "q": "Change the p text color to red (from the fourth line). Final code:", "a": "h1{\n  color: blue;\n}\np{\n  color: red;\n}", "t": false, "copy": true}, {"n": 6, "q": "Change the h1 background color to yellow (third line). Final code:", "a": "h1{\n  color: blue;\n  background-color: yellow;\n}\np{\n  color: red;\n}", "t": false, "copy": true}, {"n": 7, "q": "Change the p background color to orange (seventh line). Final code:", "a": "h1{\n  color: red;\n  background-color: yellow;\n}\np{\n  color: blue;\n  background-color: orange;\n}", "t": false, "copy": true}]}, {"title": "Lesson 2: Fonts", "items": [{"n": 1, "q": "Press “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Make the font bold.", "a": "p {\n  font-weight: bold;\n}", "t": false, "copy": true}, {"n": 3, "q": "Make the p letters normal weight.", "a": "p {\n  font-weight: normal;\n}", "t": false, "copy": true}, {"n": 4, "q": "Enter any numeric value for font weight (enter 900 to continue).", "a": "900", "t": false, "copy": true}, {"n": 5, "q": "Make the text inside p smaller.", "a": "p {\n  font-size : 10px;\n}", "t": false, "copy": true}, {"n": 6, "q": "Make the text inside p larger.", "a": "p {\n  font-size : 50px;\n}", "t": false, "copy": true}]}, {"title": "Lesson 3: Classes", "items": [{"n": 1, "q": "Press “Run code” without changing anything.", "a": "Just press “Run code”.", "t": true, "copy": true}, {"n": 2, "q": "Make the p color blue and then green.", "a": "p{\n  color: blue;\n}\np{\n  color: green;\n}", "t": false, "copy": true}, {"n": 3, "q": "Add a class name to the two p tags.", "a": "<p class=\"sea\">Let's go to the sea.</p>\n<p class=\"mountains\">Let's go to the mountains.</p>", "t": false, "copy": true}, {"n": 4, "q": "Write the class names in CSS (the first blue and the second green).", "a": ".sea{\n  color: blue;\n}\n.mountains{\n  color: green;\n}", "t": false, "copy": true}, {"n": 5, "q": "Add the classes apple and watermelon.", "a": "<p class=\"apple\">Apple</p>\n<p class=\"watermelon\">Watermelon</p>", "t": false, "copy": true}, {"n": 6, "q": "Change the color of the classes apple and watermelon.", "a": ".apple{\n  color:red;\n}\n.watermelon{\n  color:green;\n}", "t": false, "copy": true}]}, {"title": "Lesson 4: Comments", "items": [{"n": 1, "q": "What would you like to build in the future?", "a": "A website", "t": true, "copy": true}, {"n": 2, "q": "Add a comment in CSS.", "a": "/* Change the color of the text of the h1 tag to red. */\nh1{\n  color: red;\n}", "t": false, "copy": true}, {"n": 3, "q": "Make the first line of HTML a comment.", "a": "<!-- Let's give a class name -->\n<p class=\"apple\">Apple</p>\n<p class=\"watermelon\">Watermelon</p>", "t": false, "copy": true}]}, {"title": "Level 19 Review", "items": [{"n": 1, "q": "Set the selector to h1.", "a": "h1{\n  color: red;\n}", "t": false, "copy": true}, {"n": 2, "q": "Set the value to blue.", "a": "h1 {\n  color:blue;\n}", "t": false, "copy": true}, {"n": 3, "q": "Choose the correct description of the color property.", "a": "Changes the text color", "t": true, "copy": true}, {"n": 4, "q": "Choose the correct description of the background-color property.", "a": "Changes the background color", "t": true, "copy": true}, {"n": 5, "q": "Choose the correct description of font-weight: bold.", "a": "The text becomes bold", "t": true, "copy": true}, {"n": 6, "q": "Choose the correct value for the font-size property.", "a": "font-size: 10px;", "t": false, "copy": true}, {"n": 7, "q": "Write CSS to change the word Dog to blue.", "a": ".dog{\n  color: blue;\n}", "t": false, "copy": true}, {"n": 8, "q": "Leave a comment on the first line.", "a": "/* Change the text color to navy. */\np {\n  color: navy;\n}", "t": false, "copy": true}]}]}, "20": {"title": "Review of Levels 18 and 19", "sections": [{"title": "Review of Levels 18–19: Travel Plan and Soup Recipe", "items": [{"n": 1, "q": "Use h1 to display Travel Itinerary and h2 to display Packing List.", "a": "<h1>Travel Itinerary</h1>\n<h2>Packing List</h2>", "t": false, "copy": true}, {"n": 2, "q": "Use p to display Wallet, Hat and Handkerchief with br after Wallet and Hat.", "a": "<h1>Travel Itinerary</h1>\n<h2>Packing List</h2>\n<p>Wallet<br>\nHat<br>\nHandkerchief</p>", "t": false, "copy": true}, {"n": 3, "q": "Turn the list of items into a bulleted list (from the third line).", "a": "<h1>Travel Itinerary</h1>\n<h2>Packing List</h2>\n<ul>\n<li>Wallet</li>\n<li>Hat</li>\n<li>Handkerchief</li>\n</ul>", "t": false, "copy": true}, {"n": 4, "q": "Create a numbered list for the tomato soup recipe.", "a": "<h1>How to Make Tomato Soup</h1>\n<ol>\n<li>Boil water</li>\n<li>Add ingredients</li>\n<li>Adjust the seasoning</li>\n</ol>", "t": false, "copy": true}]}, {"title": "Review of Levels 18–19: Images and CSS", "items": [{"n": 1, "q": "Display the Cody image (third line).", "a": "<h1>Cody's Page</h1>\n<p>My name is Cody.</p>\n<img src=\"cody.png\">", "t": false, "copy": true}, {"n": 2, "q": "Add the image with the alt attribute.", "a": "<h1>Cody's Page</h1>\n<p>My name is Cody.</p>\n<img src=\"miss.png\" alt=\"Cody's striking pose\">", "t": false, "copy": true}, {"n": 3, "q": "Change the h1 text color to red.", "a": "h1{ color: red; }", "t": false, "copy": true}, {"n": 4, "q": "Yellow h1 background and bold p text (do not delete the previous CSS).", "a": "h1 {\n  color: red;\n  background-color: yellow;\n}\np {\n  font-weight: bold;\n}", "t": false, "copy": true}, {"n": 5, "q": "Add the class names to the HTML (from the second line).", "a": "<h1>Greetings of the World</h1>\n<p class=\"japanese\">Konnichiwa</p>\n<p class=\"english\">Hello</p>\n<p class=\"french\">Bonjour</p>", "t": false, "copy": true}, {"n": 6, "q": "Color each line by its class (from line 8). Final code:", "a": "h1 {\n  color: red;\n  background-color: yellow;\n}\np {\n  font-weight: bold;\n}\n.japanese{\n  color: lime;\n}\n.english{\n  color: purple;\n}\n.french{\n  color: navy;\n}", "t": false, "copy": true}]}, {"title": "Level 20 Review and Test", "items": [{"n": 1, "q": "Put the text inside a p tag.", "a": "<p>Good morning</p>", "t": false, "copy": true}, {"n": 2, "q": "Choose the right tag for a line break.", "a": "br tag", "t": true, "copy": true}, {"n": 3, "q": "Choose the tag to display an image named image.png.", "a": "<img src=\"image.png\">", "t": false, "copy": true}, {"n": 4, "q": "Choose the display type for a list of strawberry, cherry and orange.", "a": "strawberry・ cherry・ orange・", "t": true, "copy": true}, {"n": 5, "q": "Set the value to yellow.", "a": "h1 {\n  color:yellow\n}", "t": false, "copy": true}, {"n": 6, "q": "Choose the correct description of the background-color property.", "a": "Changes the background color", "t": true, "copy": true}, {"n": 7, "q": "Choose the correct description of font-weight: bold.", "a": "The font becomes bold", "t": true, "copy": true}, {"n": 8, "q": "Set the selector to h3.", "a": "h3{\n  color: red;\n}", "t": false, "copy": true}, {"n": 9, "q": "Write CSS to make the word fish blue.", "a": ".fish{\n  color: blue;\n}", "t": false, "copy": true}]}]}}}, "ar": {"title": "JavaScript", "unit": "شابتر", "units": {"1": {"title": "مقدمة", "sections": [{"title": "الدرس 1: ما هي البرمجة؟ (1)", "items": [{"n": 1, "q": "أجب عن أسئلة ريكي في المحادثة.", "a": "اختر الإجابة الصحيحة «نعلّم صح».", "t": true, "copy": true}]}, {"title": "الدرس 2: ما هي البرمجة؟ (2)", "items": [{"n": 1, "q": "كم عدد لغات البرمجة الموجودة في العالم؟", "a": "أكثر من 100 نوع", "t": true, "copy": true}, {"n": 2, "q": "تحقّق مما تعلمته ثم اضغط «فهمت».", "a": "علّم صح على النقاط الثلاث.", "t": true, "copy": true}]}, {"title": "الدرس 3: كيفية استخدام المحرر", "items": [{"n": 1, "q": "أدخل نفس البرنامج كما في الأسفل.", "a": "console.log(\"Hello\");", "t": false, "copy": true}, {"n": 2, "q": "أدخل نفس البرنامج كما في الأسفل.", "a": "console.log(\"Good morning\");", "t": false, "copy": true}, {"n": 3, "q": "تحقّق مما تعلمته ثم اضغط «فهمت».", "a": "علّم صح على النقاط الثلاث.", "t": true, "copy": true}]}, {"title": "الدرس 4: وحدة التحكم", "items": [{"n": 1, "q": "ماذا تُسمى الشاشة السوداء التي تكتب فيها برنامجك؟", "a": "المحرر", "t": true, "copy": true}, {"n": 2, "q": "أدخل نفس البرنامج.", "a": "console.log(\"Good evening\");", "t": false, "copy": true}, {"n": 3, "q": "اعرض \"Good night\" في وحدة التحكم.", "a": "console.log(\"Good night\");", "t": false, "copy": true}, {"n": 4, "q": "ابحث عن الأخطاء ثم اضغط «تشغيل الكود».", "a": "اضغط «تشغيل الكود» مباشرة.", "t": true, "copy": true}, {"n": 5, "q": "اعرض \"Good luck\" في وحدة التحكم.", "a": "console.log(\"Good luck\")", "t": false, "copy": true}]}, {"title": "الدرس 5: تعليق", "items": [{"n": 1, "q": "انقر على «تشغيل الكود» دون تعديل.", "a": "اضغط «تشغيل الكود» فقط.", "t": true, "copy": true}, {"n": 2, "q": "عدّل السطر الأول ليصبح تعليقًا.", "a": "//When executed, the text is output to the console.\nconsole.log(\"Hello\");", "t": false, "copy": true}]}, {"title": "الدرس 6: التعليق خارج البرنامج", "items": [{"n": 1, "q": "ضع تعليقًا بالجملة \"Greetings for the day\".", "a": "//Greetings for the day.\nconsole.log(\"Good morning\");\nconsole.log(\"Hello\");\nconsole.log(\"Good evening\");", "t": false, "copy": true}, {"n": 2, "q": "عدّل السطر الثاني ليصبح تعليقًا.", "a": "console.log(\"Eggs\");\n//console.log(\"Apple\");\nconsole.log(\"Milk\");", "t": false, "copy": true}, {"n": 3, "q": "علّق البرنامج الذي يعرض \"Fish\".", "a": "console.log(\"Lion\");\n//console.log(\"Fish\");\nconsole.log(\"Elephant\");\nconsole.log(\"Giraffe\");", "t": false, "copy": true}, {"n": 4, "q": "هل يبدو كل شيء جيدًا حتى الآن؟", "a": "نعم ممتاز", "t": true, "copy": true}]}, {"title": "مراجعة المستوى الأول", "items": [{"n": 1, "q": "اختر البرنامج الصحيح لعرض \"Hello\".", "a": "console.log(\"Hello\");", "t": false, "copy": true}, {"n": 2, "q": "اعرض \"Good morning\".", "a": "console.log(\"Good morning\");", "t": false, "copy": true}, {"n": 3, "q": "اعرض \"Programming\".", "a": "console.log(\"Programming\");", "t": false, "copy": true}, {"n": 4, "q": "اعرض \"Hello\".", "a": "console.log(\"Hello\");", "t": false, "copy": true}, {"n": 5, "q": "اختر الطريقة الصحيحة لكتابة التعليق.", "a": "//Write your comments here.", "t": false, "copy": true}, {"n": 6, "q": "علّق البرنامج لتكون المخرجات: Hello. / My name is / Cody.", "a": "console.log(\"Hello.\");\nconsole.log(\"My name is\");\n//console.log(\"Rick.\");\nconsole.log(\"Cody.\");", "t": false, "copy": true}]}]}, "2": {"title": "الحسابات والنصوص", "sections": [{"title": "الدرس 1: الحساب الأول", "items": [{"n": 1, "q": "اعرض \"Let's calculate.\" في وحدة التحكم.", "a": "console.log(\"Let's calculate.\");", "t": false, "copy": true}, {"n": 2, "q": "أدخل نفس البرنامج.", "a": "console.log(\"1+1\");", "t": false, "copy": true}, {"n": 3, "q": "عدّل البرنامج ليصبح كما يلي.", "a": "console.log(1+1);", "t": false, "copy": true}, {"n": 4, "q": "احسب 1400+3600 واعرض النتيجة.", "a": "console.log(1400+3600);", "t": false, "copy": true}]}, {"title": "الدرس 2: العمليات الحسابية", "items": [{"n": 1, "q": "احسب 432+345.", "a": "console.log(432+345);", "t": false, "copy": true}, {"n": 2, "q": "احسب 100-50.", "a": "console.log(100-50);", "t": false, "copy": true}, {"n": 3, "q": "احسب 5×6.", "a": "console.log(5*6);", "t": false, "copy": true}, {"n": 4, "q": "احسب 10÷5.", "a": "console.log(10/5);", "t": false, "copy": true}, {"n": 5, "q": "احسب 10000000000 × 10000000000.", "a": "console.log(10000000000*10000000000);", "t": false, "copy": true}]}, {"title": "الدرس 3: النص والحساب معًا", "items": [{"n": 1, "q": "انقر على «تشغيل الكود» دون تعديل.", "a": "اضغط «تشغيل الكود» فقط.", "t": true, "copy": true}, {"n": 2, "q": "أكمل الناقص بعلامتَي + +", "a": "console.log(\"Set of 2 coffees \" + (250 * 2) + \" codycoins\");", "t": false, "copy": true}, {"n": 3, "q": "اكتب الناقص: (250 * 2)", "a": "console.log(\"Set of 2 coffees \" + (250 * 2) + \" codycoins\");", "t": false, "copy": true}, {"n": 4, "q": "انقر على «تشغيل الكود» دون تعديل.", "a": "اضغط «تشغيل الكود» فقط.", "t": true, "copy": true}]}, {"title": "الدرس 4: تطبيق", "items": [{"n": 1, "q": "أكمل السطر الثاني. الناقص:", "a": "+ (250 * 3) +", "t": false, "copy": true}, {"n": 2, "q": "أكمل البرنامج. الناقص:", "a": "+ (320 * 1) +", "t": false, "copy": true}, {"n": 3, "q": "اعرض \"Two muffins 640 codycoins\" مع حساب 320 × 2. الناقص:", "a": "\" + (320 * 2) + \"", "t": false, "copy": true}]}, {"title": "مراجعة المستوى الثاني", "items": [{"n": 1, "q": "اختر البرنامج الصحيح لحساب 50+100.", "a": "console.log(50 + 100);", "t": false, "copy": true}, {"n": 2, "q": "اختر رمز القسمة الصحيح.", "a": "/", "t": false, "copy": true}, {"n": 3, "q": "احسب 19+40.", "a": "console.log(19+40);", "t": false, "copy": true}, {"n": 4, "q": "احسب 7-2.", "a": "console.log(7-2);", "t": false, "copy": true}, {"n": 5, "q": "احسب 15 ÷ 5.", "a": "console.log(15/5);", "t": false, "copy": true}, {"n": 6, "q": "اختر البرنامج الصحيح لعرض \"Today is the 17th. 7 days ago was the 10th.\"", "a": "console.log(\"Today is the 17th.7 days ago was the \" + (17 - 7) + \"th.\");", "t": false, "copy": true}, {"n": 7, "q": "احسب 2*5 واعرض \"The answer is 10.\"", "a": "console.log(\"The answer is \" + (2*5) + \".\");", "t": false, "copy": true}]}]}, "3": {"title": "المتغيرات", "sections": [{"title": "الدرس 1: عرض المتغير", "items": [{"n": 1, "q": "اعرض قيمة المتغير fish في وحدة التحكم (السطر الناقص).", "a": "let fish;\nfish = 0;\nfish = fish + 3;\nfish = fish + 7;\nconsole.log(fish);", "t": false, "copy": true}, {"n": 2, "q": "اعرض النص \"fish\" في وحدة التحكم.", "a": "let fish;\nfish = 0;\nfish = fish + 3;\nfish = fish + 7;\nconsole.log(\"fish\");", "t": false, "copy": true}]}, {"title": "الدرس 2: الإسناد والجمع", "items": [{"n": 1, "q": "أعلن fish وأسند 0 ثم fish + 8 ثم fish + 12 واعرضه.", "a": "let fish;\nfish = 0;\nfish = fish + 8;\nfish = fish + 12;\nconsole.log(fish);", "t": false, "copy": true}, {"n": 2, "q": "المتغير apple: 0 ثم +5 ثم +8 ثم اعرضه.", "a": "let apple;\napple = 0;\napple = apple + 5;\napple = apple + 8;\nconsole.log(apple);", "t": false, "copy": true}, {"n": 3, "q": "المتغير allowance: 700 ثم +1500 ثم اعرضه.", "a": "let allowance;\nallowance = 700;\nallowance = allowance + 1500;\nconsole.log(allowance);", "t": false, "copy": true}]}, {"title": "مراجعة المستوى الثالث", "items": [{"n": 1, "q": "اختر البرنامج الصحيح لإعلان المتغير score.", "a": "let score;", "t": false, "copy": true}, {"n": 2, "q": "اختر البرنامج الصحيح لعرض score.", "a": "console.log(score);", "t": false, "copy": true}, {"n": 3, "q": "أعلن المتغير number ثم اضغط «Answer».", "a": "let number", "t": false, "copy": true}, {"n": 4, "q": "السطر الثاني: أسند 100 إلى number ثم اضغط «Answer».", "a": "let number;\nnumber = 100", "t": false, "copy": true}, {"n": 5, "q": "السطر الثالث: اعرض number.", "a": "let number;\nnumber = 10;\nconsole.log(number)", "t": false, "copy": true}, {"n": 6, "q": "بعد السطر الثالث: أضف 10 إلى number ثم اعرضه.", "a": "let number;\nnumber = 3;\nnumber = number +10\nconsole.log(number)", "t": false, "copy": true}]}]}, "4": {"title": "مراجعة المستويات 1 إلى 3", "sections": [{"title": "الدرس 1: مراجعة من 1 إلى 3", "items": [{"n": 1, "q": "اكتب الجملة Write the program on the line below. كتعليق، ثم اطبع \"Good evening\".", "a": "//Write the program on the line below.\nconsole.log(\"Good evening\");", "t": false, "copy": true}, {"n": 2, "q": "اطبع \"Bread and coffee for 350 codycoins\" مع حساب 200+150. الناقص:", "a": "console.log(\"Bread and coffee for \" + (200 + 150) + \" codycoins\");", "t": false, "copy": true}, {"n": 3, "q": "أعلن num وأسند 2 ثم num + 8 واطبعه.", "a": "let num;\nnum = 2;\nnum = num + 8;\nconsole.log(num);", "t": false, "copy": true}]}, {"title": "اختبار المستوى الرابع", "items": [{"n": 1, "q": "اختر البرنامج الصحيح لإخراج \"Hello\".", "a": "console.log(\"Hello\");", "t": false, "copy": true}, {"n": 2, "q": "أخرج \"Hello\" على الـ console.", "a": "console.log(\"Hello\");", "t": false, "copy": true}, {"n": 3, "q": "غيّر \"Leave this text.\" إلى تعليق.", "a": "//Leave this text.\nconsole.log(\"Make the first line a comment.\");", "t": false, "copy": true}, {"n": 4, "q": "اختر البرنامج الذي يحسب 5+7 ويخرج النتيجة.", "a": "console.log(5 + 7);", "t": false, "copy": true}, {"n": 5, "q": "اختر رمز الضرب الصحيح.", "a": "*", "t": false, "copy": true}, {"n": 6, "q": "احسب 3*5 وأخرج \"The answer is 15.\"", "a": "console.log(\"The answer is \" + ( 3 * 5) + \".\");", "t": false, "copy": true}, {"n": 7, "q": "اختر التصريح الصحيح للمتغير number.", "a": "let number;", "t": false, "copy": true}, {"n": 8, "q": "صرّح عن num، أسند 5، ثم أخرج قيمته.", "a": "let num\nnum = 5\nconsole.log(num)", "t": false, "copy": true}]}]}, "5": {"title": "جملة if", "sections": [{"title": "الدرس 1: التصريح والإسناد في سطر", "items": [{"n": 1, "q": "صرّح عن fish وأسند 0 ثم اطبعه.", "a": "let fish;\nfish = 0;\nconsole.log(fish);", "t": false, "copy": true}, {"n": 2, "q": "أدخل البرنامج كما يلي.", "a": "let fish = 0;\nconsole.log(fish);", "t": false, "copy": true}, {"n": 3, "q": "apple = 0 في سطر واحد، ثم أضف 10، ثم اطبعه (3 أسطر).", "a": "let apple = 0;\napple = apple + 10;\nconsole.log(apple);", "t": false, "copy": true}]}, {"title": "الدرس 2: الشرط (ريكي)", "items": [{"n": 1, "q": "أجب عن سؤال ريكي: أي المواد واثق فيها؟", "a": "العلوم", "t": true, "copy": true}, {"n": 2, "q": "انقر على «تشغيل الكود» بدون تعديل.", "a": "اضغط «تشغيل الكود» فقط.", "t": true, "copy": true}, {"n": 3, "q": "أسند 80 للمتغير science. اكتب في المكان : "let num = 4;\nif (num == 1){console.log(\"New bicycle\");}\nelse if (num == 2){console.log(\"Pair of tickets to the aquarium\");}\nelse if (num == 3){console.log(\"10 bags of potato chips\");}\nelse if (num == 4){console.log(\"Illustrated book of sea creatures\");}", "t": false, "copy": true}, {"n": 3, "q": "السطر السادس: اعرض \"Stickers\" إذا لم يتحقق أي شرط (num = 10).", "a": "let num = 10;\nif (num == 1){console.log(\"New bicycle\");}\nelse if (num == 2){console.log(\"Pair of tickets to the aquarium\");}\nelse if (num == 3){console.log(\"10 bags of potato chips\");}\nelse if (num == 4){console.log(\"Illustrated book of sea creatures\");}\nelse{console.log(\"Stickers\");}", "t": false, "copy": true}]}, {"title": "الدرس 3: تطبيقات", "items": [{"n": 1, "q": "people == 2 → \"10% off\"، people >= 3 → \"20% off\"، وإلا \"retail price\".", "a": "let people = 3;\nif (people == 2){console.log(\"10% off\");}\nelse if (people >= 3){console.log(\"20% off\");}\nelse {console.log(\"retail price\");}", "t": false, "copy": true}, {"n": 2, "q": "egg == 0 / egg <= 3 / غير ذلك. الناقصelse if (egg <= 3)", "a": "let egg = 2;\nif (egg == 0){console.log(\"I have to go buy more eggs\");}\nelse if (egg <= 3){console.log(\"I'm almost out of eggs\");}\nelse {console.log(\"I still have eggs\");}", "t": false, "copy": true}, {"n": 3, "q": "ما نتيجة تشغيل البرنامج؟", "a": "Less than or equal to 10", "t": true, "copy": true}, {"n": 4, "q": "اضغط «تشغيل الكود» دون تعديل.", "a": "اضغط «تشغيل الكود» فقط.", "t": true, "copy": true}]}, {"title": "مراجعة المستوى السابع", "items": [{"n": 1, "q": "اختر برنامجًا: إذا ~ افعل A، وإذا لم يكن كذلك افعل B.", "a": "if (conditional){A}\nelse if (conditional){B}", "t": false, "copy": true}, {"n": 2, "q": "السطر الثالث: num == 2 اعرض \"Two\".", "a": "let num = 2;\nif (num == 1){console.log(\"One\");}\nelse if (num == 2){console.log(\"Two\")};", "t": false, "copy": true}, {"n": 3, "q": "السطر الثالث: score >= 80 اعرض \"Pass\".", "a": "let score = 82;\nif (score == 100){console.log(\"Perfect score\");}\nelse if (score >= 80){console.log(\"Pass\")}", "t": false, "copy": true}, {"n": 4, "q": "اختر ناتج البرنامج عندما score = 62.", "a": "Pass", "t": true, "copy": true}, {"n": 5, "q": "egg = 5: 0 → \"No stock\"، <= 3 → \"Low stock\"، وإلا \"In stock\".", "a": "let egg = 5;\nif (egg == 0){console.log(\"No stock\");}\nelse if (egg <= 3){console.log(\"Low stock\");}\nelse{console.log(\"In stock\");}", "t": false, "copy": true}]}]}, "8": {"title": "مراجعة المستويات 5 إلى 7", "sections": [{"title": "الدرس 1: مراجعة من 5 إلى 7", "items": [{"n": 1, "q": "أعلن science = 100 (في سطر واحد)، وإذا كانت 100 اعرض \"The reward is a cake\".", "a": "let science = 100;\nif (science == 100){console.log(\"The reward is a cake\");}", "t": false, "copy": true}, {"n": 2, "q": "هل سيعرض let science = 80; console.log(science == 60); كلمة true أم false؟", "a": "false", "t": true, "copy": true}, {"n": 3, "q": "السطر الثالث: اعرض \"No reward\" إذا لم يتحقق الشرط.", "a": "let science = 80;\nif (science == 100){console.log(\"The reward is a cake\");}\nelse {console.log(\"No reward\");}", "t": false, "copy": true}, {"n": 4, "q": "اعرض \"Homework\" إذا test <= 50 وإلا \"No homework\". الناقص:", "a": "let test = 30;\nif (test <= 50){console.log(\"Homework\");}else {console.log(\"No homework\");}", "t": false, "copy": true}, {"n": 5, "q": "test = 77: 100 → \"Perfect score\"، >= 75 → \"Pass\"، وإلا \"Make-up exam\".", "a": "let test = 77;\nif (test == 100){console.log(\"Perfect score\");}\nelse if (test >= 75){console.log(\"Pass\");}\nelse{console.log(\"Make-up exam\");}", "t": false, "copy": true}]}, {"title": "مراجعة المستوى الثامن", "items": [{"n": 1, "q": "صرّح num = 7، وإذا كان يساوي 7 اطبع \"Correct\".", "a": "let num = 7\nif (num == 7){console.log(\"Correct\")}", "t": false, "copy": true}, {"n": 2, "q": "اختر ناتجlet num = 10; console.log(num == 10);", "a": "true", "t": true, "copy": true}, {"n": 3, "q": "السطر الثاني: الشرط الناقص:", "a": "let score = /* ═══ أصوات تفاعلية ═══ */
let AC=null;
const ctx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f1,f2,dur,type,vol){
  try{const c=ctx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.02);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.04);}catch(e){}
}
const playClick=()=>tone(880,880,0.07,'square',0.05);
const playLaser=()=>tone(1200,180,0.18,'sawtooth',0.1);
const playPop=()=>tone(300,600,0.1,'sine',0.07);
const playCopyS=()=>tone(1200,1600,0.06,'sine',0.06);

/* ═══ الحالة ═══ */
let active=null, currentUnit=null, track=null;
const $=id=>document.getElementById(id);
const panel=$('panel'),content=$('content'),chips=$('chips'),trackPanel=$('trackPanel');
const homeEl=document.querySelector('.home');

/* عدّادات في الأزرار */
$('meta-js').textContent=`${Object.keys(DATA.js.units).length} شابتر`;
$('meta-lang').textContent=`${Object.keys(DATA.js.units).length} شابتر`;
$('meta-ar').textContent=`${Object.keys(DATA.ar.units).length} شابتر`;

/* ═══ أزرار المنصات ═══ */
document.querySelectorAll('.pbtn').forEach(b=>{
  b.addEventListener('mouseenter',playClick);
  b.addEventListener('click',()=>{
    playLaser();
    if(b.dataset.p==='portal'){window.open('https://sprixportal.jp/','_blank');return;}
    document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    openPlatform(b.dataset.p);
  });
});

$('backBtn').addEventListener('click',()=>{
  playClick();
  panel.style.display='none';
  trackPanel.style.display='block';
  currentUnit=null;
  window.scrollTo({top:0,behavior:'smooth'});
});

$('trackBackBtn').addEventListener('click',()=>{
  playClick();
  trackPanel.style.display='none';
  panel.style.display='none';
  homeEl.style.display='flex';
  document.querySelector('.main-title').style.display='';
  document.querySelector('.disclaimer-box').style.display='';
  document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('active'));
  active=null;track=null;
  window.scrollTo({top:0,behavior:'smooth'});
  fitTitle();
});

document.querySelectorAll('.track-btn').forEach(b=>{
  b.addEventListener('mouseenter',playClick);
  b.addEventListener('click',()=>{playLaser();chooseTrack(b.dataset.track);});
});


function openPlatform(p){
  active=p;currentUnit=null;track=null;
  document.querySelector('.main-title').style.display='none';
  document.querySelector('.disclaimer-box').style.display='none';
  document.body.dataset.active=p;
  homeEl.style.display='none';
  panel.style.display='none';
  trackPanel.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function chooseTrack(t){
  track=t;currentUnit=null;
  document.body.dataset.track=t;
  trackPanel.style.display='none';
  panel.style.display='block';
  renderChips();
  renderContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderChips(){
  chips.innerHTML='';
  chips.style.display = 'grid';
  if(active==='js'){
    if(currentUnit===null){
      // شبكة المربعات
      const units = Object.keys(DS().units).map(Number).sort((a,b)=>a-b).map(id=>({id,label:DS().unit}));
      units.forEach(u=>{
        const t=document.createElement('button');
        t.className='unit-tile';
        t.innerHTML=`<span class="t-num">${u.id}</span><span class="t-label">${u.label} ${u.id}</span>`;
        t.onclick=()=>{playClick();selectUnit(u.id);};
        chips.appendChild(t);
      });
    }else{
      // زرار الرجوع لشبكة الشباتر
      const b=document.createElement('button');
      b.className='unit-tile back-tile';
      const label = 'كل الشباتر';
      b.innerHTML=`<span class="t-num">←</span><span>${label}</span>`;
      b.onclick=()=>{playClick();backToGrid();};
      chips.appendChild(b);
    }
  }
}

function backToGrid(){
  currentUnit=null;
  renderChips();
  renderContent();
}

function selectUnit(u){
  currentUnit=u;
  renderChips();
  renderContent();
}

/* ═══ نسخ مع بديل احتياطي ═══ */
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  return fallbackCopy(text);
}
function fallbackCopy(text){
  return new Promise((res,rej)=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:-9999px;opacity:0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      ok?res():rej(new Error('copy failed'));
    }catch(e){rej(e);}
  });
}

/* ═══ عرض المحتوى ═══ */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function buildQ(num,title,question,answer,copyable,isText,crumb){
  const q=document.createElement('div');q.className='q';
  const head=document.createElement('button');head.type='button';
  head.className='q-head';head.setAttribute('aria-expanded','false');
  head.innerHTML=`<span class="q-num">${num}</span><span class="q-title">${crumb?`<span class="crumb">${esc(crumb)}</span>`:''}${esc(title)}</span><span class="q-arrow">▾</span>`;
  q.appendChild(head);
  const body=document.createElement('div');body.className='q-body';body.setAttribute('inert','');
  const inner=document.createElement('div');inner.className='q-inner';
  if(question){const AR=(track==='ar');inner.innerHTML+=`<div class="q-question${AR?' ar-q':''}"><b>${AR?'السؤال:':'Question:'}</b> ${AR?bidiHtml(question):`<span dir="ltr">${esc(question)}</span>`}</div>`;}
  const ans=document.createElement('div');
  ans.className='answer'+(isText?' text':'');
  if(isText){const AR=(track==='ar');if(AR){ans.classList.add('ar-a');ans.innerHTML=bidiHtml(answer);}else{ans.innerHTML=esc(answer);}}
  else{ans.innerHTML=`<pre>${esc(answer)}</pre>`;}
  if(copyable){
    const btn=document.createElement('button');
    btn.className='copy-btn';btn.textContent='نسخ';btn.setAttribute('aria-live','polite');btn.setAttribute('aria-label','نسخ الإجابة');
    btn.onclick=e=>{
      e.stopPropagation();
      copyText(answer).then(()=>{
        playCopyS();btn.textContent='✓ تم';btn.setAttribute('aria-label','تم النسخ');setTimeout(()=>btn.textContent='نسخ',1400);
      }).catch(()=>{btn.textContent='تعذّر النسخ';setTimeout(()=>btn.textContent='نسخ',1400);});
    };
    ans.appendChild(btn);
  }
  inner.appendChild(ans);
  body.appendChild(inner);q.appendChild(body);
  head.addEventListener('click',()=>{
    const was=q.classList.contains('open');
    q.parentElement.querySelectorAll('.q').forEach(x=>{
      x.classList.remove('open');
      const xh=x.querySelector('.q-head'); if(xh)xh.setAttribute('aria-expanded','false');
      const xb=x.querySelector('.q-body'); if(xb)xb.setAttribute('inert','');
    });
    if(!was){q.classList.add('open');head.setAttribute('aria-expanded','true');
      body.removeAttribute('inert');playPop();}
  });
  return q;
}


function DS(){return (track==='ar'&&DATA.ar)?DATA.ar:DATA.js;}

// Wrap Latin/code runs in <bdi dir="ltr"> so an RTL paragraph does not reorder them.
function bidiHtml(s){
  const AR=/[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
  let out='',i=0;
  while(i<s.length){
    if(AR.test(s[i])){out+=esc(s[i]);i++;continue;}
    let j=i;
    while(j<s.length&&!AR.test(s[j]))j++;
    const seg=s.slice(i,j);
    if(/[A-Za-z0-9]/.test(seg)&&seg.trim().length>1){
      const lead=seg.slice(0,seg.length-seg.trimStart().length);
      const trail=seg.slice(seg.trimEnd().length);
      out+=esc(lead)+'<bdi dir="ltr">'+esc(seg.trim())+'</bdi>'+esc(trail);
    }else{out+=esc(seg);}
    i=j;
  }
  return out;
}

function renderContent(){
  content.innerHTML='';
  if(!active)return;
  if(currentUnit===null){content.innerHTML='';return;}
  const unit=DS().units[currentUnit];
  if(!unit)return;
  const AR=track==='ar';

  const head=document.createElement('div');
  head.className='group-title level-head';
  head.textContent=AR?`شابتر ${currentUnit} – ${unit.title}`:`Level ${currentUnit} – ${unit.title}`;
  content.appendChild(head);

  unit.sections.forEach(sec=>{
    if(!sec.items.length)return;
    const st=document.createElement('div');
    st.className='group-title section-head';
    st.textContent=sec.title;
    content.appendChild(st);
    sec.items.forEach(it=>{
      const q=buildQ(it.n,AR?`السؤال ${it.n}`:`Question ${it.n}`,it.q,it.a,it.copy,it.t);
      if(AR)q.classList.add('ar');
      content.appendChild(q);
    });
  });
}

(function(){
  const overlay=document.getElementById('aboutOverlay');
  let lastFocus=null;
  const focusables=()=>[...overlay.querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])')].filter(e=>e.offsetParent!==null);
  const open=()=>{try{if(typeof playLaser==='function')playLaser();}catch(e){}
    lastFocus=document.activeElement;
    overlay.classList.add('open');
    overlay.removeAttribute('inert');
    document.body.style.overflow='hidden';
    const f=focusables(); if(f.length)f[0].focus();};
  const close=()=>{try{if(typeof playClick==='function')playClick();}catch(e){}
    overlay.classList.remove('open');
    overlay.setAttribute('inert','');
    document.body.style.overflow='';
    if(lastFocus&&lastFocus.focus)lastFocus.focus();};
  overlay.addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const f=focusables(); if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
  document.getElementById('aboutBlock').addEventListener('click',open);
  const expandBtn=document.getElementById('expandBtn'),homeExtra=document.getElementById('homeExtra');
  expandBtn.addEventListener('click',()=>{
    try{if(typeof playClick==='function')playClick();}catch(e){}
    const isOpen=homeExtra.classList.toggle('open');
    expandBtn.classList.toggle('open',isOpen);
    expandBtn.setAttribute('aria-expanded',isOpen?'true':'false');
    if(isOpen) homeExtra.removeAttribute('inert'); else homeExtra.setAttribute('inert','');
  });
  document.getElementById('aboutClose').addEventListener('click',close);
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  addEventListener('keydown',e=>{if(e.key==='Escape')close();});
})();

/* ═══ ضبط حجم العنوان لأقصى عرض من غير كسر السطر ═══ */
function fitTitle(){
  const t=document.querySelector('.main-title');
  if(!t)return;
  const cs=getComputedStyle(t);
  if(cs.display==='none')return;
  const avail=t.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  if(avail<=0)return;
  const probe=document.createElement('span');
  probe.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap';
  probe.style.fontFamily=cs.fontFamily;
  probe.style.fontWeight=cs.fontWeight;
  probe.style.letterSpacing=cs.letterSpacing;
  probe.style.fontSize='100px';
  probe.textContent=t.textContent;
  document.body.appendChild(probe);
  const w=probe.getBoundingClientRect().width;
  document.body.removeChild(probe);
  if(w<=0)return;
  let size=100*avail/w;
  t.style.fontSize=size+'px';
  // تصحيح تقريب البكسل: لو النص خرج برّه ولو بكسل واحد، نقلّل تدريجيًا
  for(let i=0;i<8 && t.scrollWidth>t.clientWidth;i++){
    size*=0.99;
    t.style.fontSize=size+'px';
  }
}

/* ═══ خلفية نجوم 3D ═══ */
const canvas=document.getElementById('bg3d'),cx2=canvas.getContext('2d');
let stars=[],W,H,mx=0,my=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;
  stars=Array.from({length:120},()=>({x:(Math.random()-0.5)*W*1.6,y:(Math.random()-0.5)*H*1.6,z:Math.random()*W,
    c:Math.random()<0.5?'45,255,126':'79,157,248'}));}
resize();addEventListener('resize',()=>{resize();fitTitle();});
addEventListener('mousemove',e=>{mx=e.clientX-innerWidth/2;my=e.clientY-innerHeight/2;});
(function draw(){
  cx2.fillStyle='#070b16';cx2.fillRect(0,0,W,H);
  const ox=W/2,oy=H/2;
  for(const s of stars){
    s.z-=0.55;
    if(s.z<=1){s.z=W;s.x=(Math.random()-0.5)*W*1.6;s.y=(Math.random()-0.5)*H*1.6;}
    const sx=ox+(s.x/s.z)*W*0.6+mx*0.02*(1-s.z/W);
    const sy=oy+(s.y/s.z)*W*0.6+my*0.02*(1-s.z/W);
    const sz=Math.max(0.3,(1-s.z/W)*2.1),al=Math.max(0.05,1-s.z/W);
    cx2.beginPath();cx2.arc(sx,sy,sz,0,Math.PI*2);
    cx2.fillStyle=`rgba(${s.c},${al})`;cx2.fill();
  }
  requestAnimationFrame(draw);
})();
